name: Bug report
description: Report a problem with Pulse.
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command used
      placeholder: digest:news --dry-run
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove secrets and personal data before sharing logs.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
